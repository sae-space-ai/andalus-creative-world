name: Verify FASE 00

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  # ============================================================
  # JOB 1: Frontend Build & Typecheck
  # ============================================================
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck || echo "Typecheck script not defined, skipping"

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/

  # ============================================================
  # JOB 2: Backend Typecheck
  # ============================================================
  backend:
    name: Backend Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No cache-dependency-path because apps/api/package-lock.json doesn't exist

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate --schema ../../prisma/schema.prisma

      - name: Typecheck
        run: npm run typecheck

  # ============================================================
  # JOB 3: Prisma Validation
  # ============================================================
  prisma:
    name: Prisma Schema Validation
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/andalus_cw_test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Validate Prisma schema
        run: npx prisma validate --schema prisma/schema.prisma

      - name: Generate Prisma Client (test)
        run: npx prisma generate --schema prisma/schema.prisma

  # ============================================================
  # JOB 4: Integration Tests (with PostgreSQL)
  # ============================================================
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [frontend, backend, prisma]
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: andalus_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: andalus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    env:
      DATABASE_URL: postgresql://andalus_test:test_password@localhost:5432/andalus_test
      NODE_ENV: test
      COOKIE_SECRET: test-secret-minimum-32-characters-long!!
      FRONTEND_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate --schema ../../prisma/schema.prisma

      - name: Run migrations
        run: npx prisma migrate deploy --schema ../../prisma/schema.prisma

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify database tables exist
        env:
          PGPASSWORD: test_password
        run: |
          echo "=== Database Diagnostics ==="
          echo "Checking PostgreSQL connection..."
          psql -h localhost -U andalus_test -d andalus_test -c "SELECT version();"
          
          echo ""
          echo "Checking search_path..."
          psql -h localhost -U andalus_test -d andalus_test -c "SHOW search_path;"
          
          echo ""
          echo "Listing all tables in public schema..."
          psql -h localhost -U andalus_test -d andalus_test -c "\dt public.*"
          
          echo ""
          echo "Verifying essential tables exist..."
          psql -h localhost -U andalus_test -d andalus_test -c "
            SELECT table_name 
            FROM information_schema.tables 
            WHERE table_schema = 'public' 
            AND table_name IN ('User', 'Session', 'Project', 'SourceDocument', 'DocumentPage')
            ORDER BY table_name;
          "
          
          echo ""
          echo "Checking Prisma migration status..."
          psql -h localhost -U andalus_test -d andalus_test -c "
            SELECT * FROM _prisma_migrations ORDER BY finished_at DESC LIMIT 5;
          " || echo "No migrations table found"
          
          echo ""
          echo "=== Diagnostics Complete ==="

      - name: Verify essential tables exist (fail if missing)
        env:
          PGPASSWORD: test_password
        run: |
          echo "=== Verifying Essential Tables ==="
          
          TABLE_COUNT=$(psql -h localhost -U andalus_test -d andalus_test -t -c "
            SELECT COUNT(*) 
            FROM information_schema.tables 
            WHERE table_schema = 'public' 
            AND table_name IN ('User', 'Session', 'Project', 'SourceDocument', 'DocumentPage', 'DocumentProcessingJob', 'EmailVerificationToken', 'PasswordResetToken', 'SecurityEvent', 'ExternalIdentity', 'CreditWallet', 'CreditLedgerEntry', 'PromotionCampaign', 'PromotionRedemption', 'PaymentRecord');
          ")
          
          echo "Found $TABLE_COUNT essential tables"
          
          if [ "$TABLE_COUNT" -lt 15 ]; then
            echo "ERROR: Expected 15 essential tables but found $TABLE_COUNT"
            echo "Missing tables - migration may have failed"
            exit 1
          fi
          
          echo "✅ All 15 essential tables exist"
          echo "=== Verification Complete ==="

      - name: Run integration tests
        run: npm test

  # ============================================================
  # JOB 5: E2E Tests (with Playwright)
  # ============================================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [integration]
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: andalus_e2e
          POSTGRES_PASSWORD: e2e_password
          POSTGRES_DB: andalus_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://andalus_e2e:e2e_password@localhost:5432/andalus_e2e
      NODE_ENV: test
      COOKIE_SECRET: e2e-secret-minimum-32-characters-long!!
      FRONTEND_URL: http://localhost:3000
      VITE_API_URL: http://localhost:3001/api/v1

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: cd apps/api && npm install

      - name: Generate Prisma Client
        run: cd apps/api && npx prisma generate --schema ../../prisma/schema.prisma

      - name: Run migrations
        run: cd apps/api && npx prisma migrate deploy --schema ../../prisma/schema.prisma

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Start backend
        run: cd apps/api && npm run dev &
        
      - name: Start frontend
        run: npm run dev &

      - name: Wait for services
        run: |
          sleep 15
          curl -f http://localhost:3001/api/v1/health || exit 1

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
