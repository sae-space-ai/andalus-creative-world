name: Verify FASE 00

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  # ============================================================
  # JOB 1: Frontend Build & Typecheck
  # ============================================================
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/

  # ============================================================
  # JOB 2: Backend Typecheck
  # ============================================================
  backend:
    name: Backend Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

  # ============================================================
  # JOB 3: Prisma Validation
  # ============================================================
  prisma:
    name: Prisma Schema Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci || npm install

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

  # ============================================================
  # JOB 4: Integration Tests (with PostgreSQL)
  # ============================================================
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [frontend, backend, prisma]
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: andalus_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: andalus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    env:
      DATABASE_URL: postgresql://andalus_test:test_password@localhost:5432/andalus_test
      NODE_ENV: test
      COOKIE_SECRET: test-secret-minimum-32-characters-long!!
      FRONTEND_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Run integration tests
        run: npx vitest run --reporter=verbose

  # ============================================================
  # JOB 5: E2E Tests (with Playwright)
  # ============================================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [integration]
    if: github.event_name == 'push'
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: andalus_e2e
          POSTGRES_PASSWORD: e2e_password
          POSTGRES_DB: andalus_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://andalus_e2e:e2e_password@localhost:5432/andalus_e2e
      NODE_ENV: test
      COOKIE_SECRET: e2e-secret-minimum-32-characters-long!!
      FRONTEND_URL: http://localhost:3000
      VITE_API_URL: http://localhost:3001/api/v1

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: cd apps/api && (npm ci || npm install)

      - name: Generate Prisma Client
        run: cd apps/api && npx prisma generate

      - name: Run migrations
        run: cd apps/api && npx prisma migrate deploy

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Start backend
        run: cd apps/api && npm run dev &
        
      - name: Start frontend
        run: npm run dev &

      - name: Wait for services
        run: |
          sleep 10
          curl -f http://localhost:3001/api/v1/health || exit 1

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
